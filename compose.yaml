services:
  backend:
    # Audiveris 5.11 distributes its Linux runtime for x86_64 only.
    platform: linux/amd64
    build:
      context: .
      target: backend
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,[::1]}
      DJANGO_DATA_DIR: /data
      DJANGO_SECRET_KEY_FILE: /data/django-secret-key
      AUDIVERIS_COMMAND: /opt/audiveris/bin/Audiveris
      # Leave headroom for Intel emulation on Apple Silicon.
      OMR_TIMEOUT_SECONDS: "600"
    volumes:
      - app-data:/data
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=5)"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:80"
    volumes:
      - app-data:/data:ro
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health/"]
      interval: 10s
      timeout: 10s
      retries: 6
    restart: unless-stopped

volumes:
  app-data:
