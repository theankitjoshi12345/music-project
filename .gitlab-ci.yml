workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages: [test, security, package, deploy, verify]

default:
  interruptible: true

backend-tests:
  stage: test
  tags: [python]
  image: python:3.12-bookworm
  script:
    - apt-get update -qq && apt-get install -y --no-install-recommends poppler-utils
    - pip install -r backend/requirements-docker.txt
    - python backend/manage.py check
    - python backend/manage.py makemigrations --check --dry-run
    - python backend/manage.py test scoreapi --verbosity 2
    - export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
    - DJANGO_ENV=production DJANGO_DEBUG=false DJANGO_ALLOWED_HOSTS=ci.example.test DJANGO_CSRF_TRUSTED_ORIGINS=https://ci.example.test python backend/manage.py check --deploy --fail-level WARNING

frontend-tests:
  stage: test
  tags: [node]
  image: node:22-bookworm-slim
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm test
    - npm run build
  artifacts:
    paths: [frontend/dist/]
    expire_in: 7 days

dependency-security:
  stage: security
  tags: [python]
  image: python:3.12-bookworm
  script:
    - pip install pip-audit
    - pip-audit -r backend/requirements-docker.txt --format json --output backend-audit.json
  artifacts:
    when: always
    paths: [backend-audit.json]
    expire_in: 30 days

frontend-security:
  stage: security
  tags: [node]
  image: node:22-bookworm-slim
  script:
    - cd frontend
    - npm ci
    - npm audit --audit-level=moderate --json > ../frontend-audit.json
  artifacts:
    when: always
    paths: [frontend-audit.json]
    expire_in: 30 days

container-images:
  stage: package
  tags: [python]
  # The ULL Docker runner blocks CLONE_NEWUSER, so rootless BuildKit and
  # Buildah both fail before a build starts. Kaniko is daemonless and does not
  # require a privileged runner. Pin the multi-architecture image index.
  image:
    name: gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  parallel:
    matrix:
      - TARGET: [backend, frontend]
  before_script:
    - mkdir -p /kaniko/.docker
    - printf '{"auths":{"%s":{"username":"%s","password":"%s"}}}' "$CI_REGISTRY" "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" > /kaniko/.docker/config.json
  script:
    - export IMAGE_NAME="$CI_REGISTRY_IMAGE/$TARGET:$CI_COMMIT_SHA"
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --target "$TARGET" --custom-platform linux/amd64 --destination "$IMAGE_NAME" --digest-file "$CI_PROJECT_DIR/$TARGET-image-digest.txt"
  artifacts:
    paths: ["*-image-digest.txt"]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_PIPELINE_SOURCE == "merge_request_event"'

# Set the protected variables only after billing, VM, and narrowly scoped IAM
# are approved and provisioned. There is no persistent service-account key.
deploy-production:
  stage: deploy
  image: google/cloud-sdk:slim
  interruptible: false
  resource_group: production
  environment:
    name: production
    url: https://$PUBLIC_HOST
  id_tokens:
    GCP_ID_TOKEN:
      aud: https://iam.googleapis.com/$GCP_WIF_PROVIDER
  script:
    - bash deploy/ci-deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $DEPLOY_ENABLED == "true"'

verify-production:
  stage: verify
  image: alpine:3.22
  environment:
    name: production
    action: verify
    url: https://$PUBLIC_HOST
  script:
    - apk add --no-cache curl
    - curl --fail --show-error --silent --retry 5 --retry-delay 5 "https://$PUBLIC_HOST/api/health/"
    - curl --fail --show-error --silent "https://$PUBLIC_HOST/" | grep -q 'Score Companion'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true" && $DEPLOY_ENABLED == "true"'
