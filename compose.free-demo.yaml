# Free temporary sharing overlay. It adds a Cloudflare Quick Tunnel to the
# existing Docker Compose stack; it creates no cloud account or paid resource.
services:
  backend:
    environment:
      # The tunnel hostname is temporary; wildcard host/origin rules are
      # limited to Cloudflare's trycloudflare.com namespace.
      DJANGO_ENV: production
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ".trycloudflare.com,localhost,127.0.0.1"
      DJANGO_CSRF_TRUSTED_ORIGINS: "https://*.trycloudflare.com"
      DJANGO_CORS_ALLOWED_ORIGINS: ""
      DJANGO_TRUST_PROXY: "true"
      DJANGO_AUTH_MODE: session

  frontend:
    ports: []
    volumes:
      - ./docker/nginx.free-demo.conf:/etc/nginx/conf.d/default.conf:ro

  tunnel:
    image: cloudflare/cloudflared:2026.10.2
    profiles: [tunnel]
    depends_on:
      frontend:
        condition: service_healthy
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://frontend:80
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
